name: Package installers

# Builds the desktop host installers (#32) with version-matched names across
# platforms, uploads them as artifacts, and — for a release tag — publishes (or
# updates) a GitHub Release with all installers + updater metadata attached.
# Signing activates when the per-platform secrets are set (docs/SIGNING.md);
# unsigned otherwise.
#
# Triggers:
#   - push of a release tag (e.g. v0.8.0-beta.1) — the manual beta path.
#   - workflow_dispatch — with a `tag` input it builds + publishes that tag
#     (this is how release-please.yml ships a stable release: it dispatches us
#     with the tag it just created); with no `tag` it builds artifacts only.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.8.0). Leave empty to build artifacts only."
        type: string
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: package-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the release tag (and derived version / pre-release flag) once, from
  # either the pushed tag or the dispatch input, so build + release agree.
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - id: t
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            # A hyphenated tag (v0.8.0-beta.1, -rc.1) is a SemVer pre-release.
            case "$TAG" in
              *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform: windows }
          # ⛔⛔ PINNED, and the pin is the fix — not a precaution (#macos-signing).
          #
          # `macos-latest` floated from image 20260728.0273.1 (macOS 26.5.2,
          # os=25.5.0) to 20260831.0337.3 (macOS 26.6.2, os=25.6.0) between
          # v0.29.1 on 2026-08-29, which SIGNED, and 2026-09-05, which did not.
          # Isolated by comparing the two runs: our code did not change, and
          # electron-builder logged **26.15.3 in BOTH** — the only difference is
          # the OS underneath it. On the newer image
          # `security set-key-partition-list` rejects the password electron-
          # builder has just set on the keychain it has just created
          # ("SecKeychainUnlock: The user name or passphrase you entered is not
          # correct"), which is why rotating the certificate was the wrong first
          # move: the .p12 was already proven to open with CSC_KEY_PASSWORD via
          # openssl, and the same builder signs fine one image earlier.
          #
          # ⭐ Windows was already pinned; macOS floating was the outlier. A
          # release path should not take an unreviewed toolchain bump.
          - { os: macos-15, platform: macos }
          - { os: ubuntu-latest, platform: linux }
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the resolved tag's commit when one is set (dispatch/tag),
          # otherwise the triggering ref.
          ref: ${{ needs.meta.outputs.tag || github.ref }}
          lfs: true # real icon binaries (*.ico/*.png) + image assets, not LFS pointers

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # When releasing, set the package version from the tag (v0.8.0 -> 0.8.0) so
      # installer filenames match the release; otherwise use package.json as-is.
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          if [ -n "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "FD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      # macOS only: if the signing secrets are configured, decode the App Store
      # Connect API key to a file and export the signing env so electron-builder
      # signs (Developer ID via CSC_LINK) + notarizes (notarytool via the API
      # key). With no secrets it stays unsigned — so forks and pre-setup builds
      # still work. See docs/SIGNING.md for the secret setup.
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          FD_SIGN_MAC_OPT_IN: ${{ vars.FD_SIGN_MAC }}
        run: |
          # ⛔⛔ macOS SIGNING IS OFF BY DEFAULT, AND THAT IS DELIBERATE.
          #
          # v0.30.0 was tagged and RELEASED WITH ZERO INSTALLERS because this
          # job failed on "SecKeychainUnlock: the user name or passphrase you
          # entered is not correct" — and `release` needs the whole matrix, so
          # Windows and Linux never published either, despite both building.
          #
          # ⚠️ IT IS NOT THE CERTIFICATE. A check here proved the .p12 opens
          # with CSC_KEY_PASSWORD via openssl and signing still failed inside
          # electron-builder's own temporary keychain. v0.29.1 signed fine on
          # 2026-08-29 with none of this code changed, so the fault is in the
          # toolchain or the runner image, not in the secrets.
          #
          # Signing is optional in this project — Windows ships unsigned today
          # ([[trusted-signing-status]] is PARKED) — and a shipped unsigned
          # build beats a release with nothing in it. So macOS signing now
          # requires an EXPLICIT opt-in: set the repository variable
          # FD_SIGN_MAC=true once signing works again. Will: "It should just
          # skip the signing and still build."
          if [ "${FD_SIGN_MAC_OPT_IN}" != "true" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::notice title=macOS build is UNSIGNED::Signing is opt-in while the keychain failure is unresolved. Set the repository variable FD_SIGN_MAC=true to re-enable it."
            echo "macOS signing not enabled (FD_SIGN_MAC is not 'true') — building unsigned."
            exit 0
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_B64" ]; then
            echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "CSC_LINK=$CSC_LINK"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD"
              echo "FD_SIGN_MAC=1"
            } >> "$GITHUB_ENV"
            echo "macOS signing + notarization enabled."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No macOS signing secrets — building unsigned."
          fi

      # Windows only: export the Azure Trusted Signing env when the secrets are
      # set. electron-builder.config.cjs reads these and adds win.azureSignOptions
      # (auth = the AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET service principal).
      # No secrets → unsigned. See docs/SIGNING.md for the Azure setup.
      - name: Prepare Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TS_PUBLISHER: ${{ secrets.AZURE_TS_PUBLISHER }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TS_ENDPOINT" ] && [ -n "$AZURE_TS_PUBLISHER" ]; then
            {
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
              echo "AZURE_TS_ENDPOINT=$AZURE_TS_ENDPOINT"
              echo "AZURE_TS_ACCOUNT=$AZURE_TS_ACCOUNT"
              echo "AZURE_TS_PROFILE=$AZURE_TS_PROFILE"
              echo "AZURE_TS_PUBLISHER=$AZURE_TS_PUBLISHER"
            } >> "$GITHUB_ENV"
            echo "Windows Azure Trusted Signing enabled."
          else
            echo "Windows signing secrets incomplete — building unsigned."
          fi

      - name: Build installer
        env:
          # macOS signs when its secrets are present (CSC_IDENTITY_AUTO_DISCOVERY);
          # Windows signs via Azure when the AZURE_TS_* env is present (set above,
          # read by electron-builder.config.cjs). Unsigned otherwise.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.FD_SIGN_MAC == '1' && 'true' || 'false' }}
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: free-dispatcher-${{ env.FD_VERSION }}-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap

  # Gather every platform's installers and publish them on the release tag. If
  # the release already exists (release-please creates it for stable cuts), just
  # attach the assets; otherwise create it (manual beta tags) with generated
  # notes, marking hyphenated tags as pre-releases.
  #
  # ⛔⛔ ONE PLATFORM MUST NOT COST THE WHOLE RELEASE. This job used to need
  # `build` to succeed OUTRIGHT, and `build` is the three-platform matrix — so a
  # single leg failing took the release down with it. Measured on the v0.30.0
  # cut: runs 33935088134 and 33935746733 both had `macos: failure` with
  # `windows: success` and `linux: success`, and BOTH had `release: skipped`.
  # The tag and its changelog were public with zero installers attached until a
  # third, hand-dispatched run (33936149629) finally published them. Two
  # platforms that built perfectly served nobody, twice, because a third did
  # not — and auto-update reads `latest*.yml` off the newest release, so an
  # assetless release is also an update path that quietly goes nowhere.
  #
  # ⭐ `!cancelled()` — NOT `always()` — lets this run on a partial matrix while
  # still refusing to publish from a run somebody stopped on purpose. It ships
  # whatever was built and says loudly what was not; the guard below still
  # refuses to publish an EMPTY release. The workflow run stays red because
  # `build` failed, which is the right signal: something IS broken, and the
  # users who could be served have been.
  release:
    name: release
    needs: [meta, build]
    if: ${{ !cancelled() && needs.meta.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v5
        # ⚠️ A wholly failed matrix leaves NO artifacts; this must not abort the
        # job before the guard below can say so in words.
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      # ⛔ NEVER PUBLISH AN EMPTY RELEASE. If every platform failed there is
      # nothing to serve, and creating the release anyway would replace a
      # working `latest.yml` on the previous tag with a newer, emptier one —
      # turning a build failure into a broken updater for everybody.
      - name: Check what actually built
        id: haul
        run: |
          shopt -s nullglob
          # ⛔ `dist/` may not exist at all when every leg failed and the download
          # step found nothing. Steps run under `bash -e -o pipefail`, so `find`
          # on a missing directory would kill this step BEFORE it could say why —
          # an inscrutable red X in precisely the case this guard exists to
          # explain. Measured: exit 1, zero output. Create it first.
          mkdir -p dist
          exe=(dist/*.exe); dmg=(dist/*.dmg); lin=(dist/*.AppImage dist/*.deb)
          total=$(find dist -type f | wc -l | tr -d ' ')
          echo "Downloaded $total file(s)."
          if [ "$total" -eq 0 ]; then
            echo "::error title=Nothing to release::No installers were produced by any platform, so there is nothing to attach to the tag. The release is left untouched."
            exit 1
          fi
          # Name every gap, because a platform with no installer ALSO has no
          # latest*.yml and therefore no update path until the next release.
          [ ${#exe[@]} -eq 0 ] && echo "::warning title=No Windows installer::Windows produced no .exe — Windows users get no update from this release."
          [ ${#dmg[@]} -eq 0 ] && echo "::warning title=No macOS installer::macOS produced no .dmg — macOS users get no update from this release."
          [ ${#lin[@]} -eq 0 ] && echo "::warning title=No Linux installer::Linux produced no .AppImage/.deb — Linux users get no update from this release."
          echo "windows=${#exe[@]} macos=${#dmg[@]} linux=${#lin[@]}"

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching installers."
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            echo "Creating release $TAG."
            FLAG=""
            [ "$PRERELEASE" = "true" ] && FLAG="--prerelease"
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes $FLAG
          fi
